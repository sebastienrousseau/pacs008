name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Every action is pinned to a commit SHA, and every pip install is
# hash-pinned (OpenSSF Scorecard Pinned-Dependencies): Poetry comes from
# .github/requirements/poetry.txt and everything it installs from
# poetry.lock, which carries the hashes.

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      # Poetry runs on 3.12, the interpreter poetry.txt is compiled for:
      # filelock, which Poetry needs, has no fixed release for 3.10
      # (GHSA-9vhv-jxww-xfm5, GHSA-567q-5qvw-pf92, GHSA-v4x8-3wr5-3wq8 are
      # fixed in 4.2.1, which needs 3.11). The project still runs on the
      # matrix Python, through `poetry env use`.
      - name: Set up Python 3.12 for the toolchain
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Poetry (hash-pinned)
        run: python -m pip install --require-hashes -r .github/requirements/poetry.txt

      - name: Use Python ${{ matrix.python-version }} for the project
        run: poetry env use "${{ steps.python.outputs.python-path }}"

      - name: Install dependencies
        run: poetry install --no-interaction --extras otel

      - name: Check the project runs on Python ${{ matrix.python-version }}
        run: poetry run python -c "import sys; v = '${{ matrix.python-version }}'; assert sys.version.startswith(v + '.'), sys.version"

      - name: Run tests (canonical, gates coverage)
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        run: poetry run pytest tests/ -v --tb=short

      # Not a timing gate -- wall-clock is not comparable between
      # runners. This proves the benchmark still runs against the
      # current API rather than rotting into a file that reads as
      # verified and is not.
      - name: Run the benchmark
        run: poetry run python benches/bench_batch_pipeline.py --quick

      - name: Run tests (matrix, no coverage gate)
        if: matrix.python-version != '3.12' || matrix.os != 'ubuntu-latest'
        # The coverage gate fires only on the canonical platform.
        # Other matrix entries (Windows / macOS, other Pythons) skip a
        # handful of Linux-only tests and Windows-only paths, which
        # legitimately lowers coverage by ~0.1pp per platform without
        # any behaviour regression. Overriding to 0 here keeps those
        # runs honest while letting the canonical run be the gate.
        run: poetry run pytest tests/ -v --tb=short --cov-fail-under=0

      - name: Upload coverage
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.xml
          fail_ci_if_error: false

  smoke:
    name: Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Poetry (hash-pinned)
        run: pip install --require-hashes -r .github/requirements/poetry.txt

      - name: Install dependencies
        run: poetry install --no-interaction --extras otel

      - name: Run smoke tests
        run: poetry run pytest tests/ -m smoke -v --no-cov --tb=short

      - name: Verify examples
        run: |
          poetry run python examples/generate_xml.py
          poetry run python examples/swift_compliance.py

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Poetry (hash-pinned)
        run: pip install --require-hashes -r .github/requirements/poetry.txt

      - name: Verify poetry.lock is current
        run: poetry check --lock

      - name: Install dependencies
        run: poetry install --no-interaction --extras otel

      # Same paths as `make lint`, so a green `make lint` means a green
      # lint job.
      - name: Ruff check
        run: poetry run ruff check pacs008/ tests/ examples/ benches/ scripts/ fuzz/

      - name: Black check
        run: poetry run black --check pacs008/ tests/ examples/ benches/ scripts/ fuzz/

      - name: Mypy
        run: poetry run mypy pacs008/

      - name: Doc coverage (interrogate)
        run: poetry run interrogate pacs008/

      # Per function: cyclomatic <= 10, cognitive <= 15, Halstead
      # difficulty <= 30, <= 60 lines; <= 500 lines per file. Offenders
      # that predate the gate live in complexity-baseline.json, which may
      # only shrink. tests/ is not measured: test_suite_conformance.py is
      # vendored from one canonical copy and checksummed.
      - name: Complexity
        run: poetry run python scripts/check_complexity.py

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Poetry (hash-pinned)
        run: pip install --require-hashes -r .github/requirements/poetry.txt

      - name: Install dependencies
        run: poetry install --no-interaction --extras otel

      - name: Bandit
        run: poetry run bandit -r pacs008/ -c pyproject.toml || poetry run bandit -r pacs008/ -s B101

  # The native advisory audit, so a published advisory against anything in
  # poetry.lock fails the pull request rather than waiting for a Dependabot
  # alert. poetry.lock pins different versions of some packages below 3.11
  # and below 3.12, so each of those splits is audited: the lock is
  # installed, without dependencies, into a bare venv of that Python (whose
  # own markers pick the lines), and pip-audit reads that venv by --path.
  # Poetry and pip-audit run on 3.12, as in the test job (filelock has no
  # fixed release for 3.10).
  audit:
    name: Dependency audit (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Python 3.12 for the toolchain
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Poetry, its export plugin and pip-audit (hash-pinned)
        run: python -m pip install --require-hashes -r .github/requirements/audit.txt

      - name: pip-audit poetry.lock on Python ${{ matrix.python-version }}
        env:
          TARGET_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          set -euo pipefail
          poetry export --all-groups --all-extras -f requirements.txt -o "$RUNNER_TEMP/poetry-lock.txt"
          # --without-pip: no seeded pip or setuptools to audit by mistake.
          "$TARGET_PYTHON" -m venv --without-pip "$RUNNER_TEMP/split"
          python -m pip --python "$RUNNER_TEMP/split/bin/python" install --quiet \
            --no-deps --require-hashes -r "$RUNNER_TEMP/poetry-lock.txt"
          site="$("$RUNNER_TEMP/split/bin/python" -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')"
          pip-audit --progress-spinner off --path "$site"

      - name: pip-audit the hash-pinned CI trees
        if: matrix.python-version == '3.12'
        run: |
          set -euo pipefail
          for f in .github/requirements/*.txt; do
            echo "--- $f ---"
            pip-audit --progress-spinner off --require-hashes --disable-pip -r "$f"
          done
